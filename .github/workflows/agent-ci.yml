name: agent-ci
on:
  push:
    branches: ['agent/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        shell: bash
        run: npm run build --if-present 2>&1 | tail -n 150
      - name: Test
        shell: bash
        run: npm test 2>&1 | tail -n 200
